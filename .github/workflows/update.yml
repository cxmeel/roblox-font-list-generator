name: Update Font List

on:
  schedule:
    - cron: '0 0 */3 * *'
    - cron: '0 3 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if no changes detected'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main

jobs:
  update-font-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache temp directory
        uses: actions/cache@v5
        with:
          path: temp/
          key: temp-dir

      - name: Set up Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Download last release
        id: download_release
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          fileName: FontList.luau
        continue-on-error: true

      - name: Prepare old font list
        shell: bash
        run: |
          if [ -f FontList.luau ]; then
            mkdir -p build
            mv FontList.luau build/OldFontList.luau
          fi

      - name: Update Font List
        run: lune run generate -- -vv

      - name: Create diff file
        shell: bash
        run: |
          if [ -f build/OldFontList.luau ]; then
            lune run diff build/OldFontList.luau build/FontList.luau -- -vv
          else
            echo "No previous release found; skipping diff generation."
          fi

      - name: Check for changes
        id: check_changes
        shell: bash
        run: |
          if [ ! -f build/OldFontList.luau ]; then
            echo "No previous release found; assuming changes exist."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          elif [ -f build/FontList.diff ] && [ -s build/FontList.diff ]; then
            echo "Changes detected in FontList.luau."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected in FontList.luau; skipping release creation."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Decide whether to release
        id: should_release
        shell: bash
        run: |
          if [ "${{ steps.check_changes.outputs.has_changes }}" = "true" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        id: create_tag
        if: steps.should_release.outputs.release == 'true'
        shell: bash
        run: |
          TAG="v$(date +'%Y.%m.%d')"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Collect added fonts
        id: additions
        if: steps.should_release.outputs.release == 'true'
        shell: bash
        run: |
          # Each addition line ends in its content uri, e.g.
          #   + Builder Extended (rbxassetid://16658237174)
          FONTS=""

          if [ -f build/FontList.diff ]; then
            FONTS=$(sed -nE 's/^\+ .*\((rbxasset[^)]*)\)$/\1/p' build/FontList.diff | tr '\n' ',' | sed 's/,$//')
          fi

          echo "fonts=${FONTS}" >> $GITHUB_OUTPUT

          if [ -n "${FONTS}" ]; then
            echo "Fonts added in this release: ${FONTS}"
            echo "has_additions=true" >> $GITHUB_OUTPUT
          else
            echo "No fonts added in this release; skipping preview."
            echo "has_additions=false" >> $GITHUB_OUTPUT
          fi

      # Previews of local (rbxasset://) fonts normally read the font files out
      # of a Roblox Studio installation, which a runner does not have. The
      # Studio fonts package the generator already downloaded has the same
      # layout under its "fonts" directory, so unpack it and point at that.
      - name: Unpack Studio font content
        id: font_content
        if: steps.additions.outputs.has_additions == 'true'
        continue-on-error: true
        shell: bash
        run: |
          FONT_PACKAGE=$(find temp -maxdepth 1 -name '*-fonts.zip' -size +1M -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)

          if [ -z "${FONT_PACKAGE}" ]; then
            echo "No Studio fonts package in temp/; local font previews will not render." >&2
            exit 1
          fi

          echo "Unpacking ${FONT_PACKAGE}"
          rm -rf temp/content
          mkdir -p temp/content/fonts
          7z x "-otemp/content/fonts" "${FONT_PACKAGE}" -y > /dev/null

      # GitHub will not render an SVG served from a release asset, so the
      # previews are rasterised before they go into the notes
      - name: Install resvg
        if: steps.additions.outputs.has_additions == 'true'
        continue-on-error: true
        shell: bash
        run: |
          RESVG_VERSION="0.48.1"
          DEST="${RUNNER_TEMP}/resvg"

          mkdir -p "${DEST}"
          curl -sSfL "https://github.com/linebender/resvg/releases/download/v${RESVG_VERSION}/resvg-linux-x86_64.tar.gz" \
            | tar -xz -C "${DEST}"

          BIN=$(find "${DEST}" -type f -name resvg | head -n1)

          if [ -z "${BIN}" ]; then
            echo "No resvg binary in the release archive" >&2
            exit 1
          fi

          chmod +x "${BIN}"
          echo "$(dirname "${BIN}")" >> "${GITHUB_PATH}"
          "${BIN}" --version

      # Never block a release on the preview; the notes simply omit it
      - name: Generate font previews
        id: previews
        if: steps.additions.outputs.has_additions == 'true'
        continue-on-error: true
        shell: bash
        run: |
          # --resvg rasterises with whatever is on PATH, which the previous step
          # put there. PNGs come out at 2x alongside the SVGs.
          lune run preview -- \
            --fonts "${{ steps.additions.outputs.fonts }}" \
            --content temp/content \
            --width 900 \
            --text "You make the game! It's free!"\
            --output build/preview \
            --resvg \
            -vv

          # The generated files are named after a hash of their inputs; the
          # release assets need a stable name to be linked from the notes
          for FORMAT in svg png; do
            mv "$(ls build/preview/*_black.${FORMAT})" "build/font-preview-light.${FORMAT}"
            mv "$(ls build/preview/*_white.${FORMAT})" "build/font-preview-dark.${FORMAT}"
          done

          # Displayed at the SVG's own width so the 2x PNG stays sharp
          WIDTH=$(sed -nE 's/.*<svg[^>]*width="([0-9]+)".*/\1/p' build/font-preview-light.svg | head -n1)
          echo "width=${WIDTH:-900}" >> $GITHUB_OUTPUT

      - name: Build release notes
        id: release_notes
        if: steps.should_release.outputs.release == 'true'
        shell: bash
        run: |
          ADDED=0
          REMOVED=0

          if [ -f build/FontList.diff ]; then
            ADDED=$(grep -c '^+ ' build/FontList.diff || true)
            REMOVED=$(grep -c '^- ' build/FontList.diff || true)
          fi

          plural() {
            if [ "$1" -eq 1 ]; then echo "font"; else echo "fonts"; fi
          }

          if [ "${ADDED}" -gt 0 ] && [ "${REMOVED}" -gt 0 ]; then
            SUMMARY="Added ${ADDED} $(plural ${ADDED}), removed ${REMOVED} $(plural ${REMOVED})."
          elif [ "${ADDED}" -gt 0 ]; then
            SUMMARY="Added ${ADDED} $(plural ${ADDED})."
          elif [ "${REMOVED}" -gt 0 ]; then
            SUMMARY="Removed ${REMOVED} $(plural ${REMOVED})."
          else
            SUMMARY="No font changes were detected; this release was published manually."
          fi

          ASSETS="https://github.com/${{ github.repository }}/releases/download/${{ steps.create_tag.outputs.tag }}"
          PREVIEW_WIDTH="${{ steps.previews.outputs.width }}"

          {
            echo "${SUMMARY}"

            # A forced release can have nothing to list, so the heading only
            # appears when there is a diff to put under it
            if [ -s build/FontList.diff ]; then
              echo
              echo "## Changes"
              echo
              echo '```diff'
              # Substitution trims trailing newlines, so the fence closes on the
              # line after the diff whether or not the file ends in one
              printf '%s\n' "$(cat build/FontList.diff)"
              echo '```'
            fi

            if [ -f build/font-preview-light.png ] && [ -f build/font-preview-dark.png ]; then
              echo
              echo "<picture>"
              echo "  <source media=\"(prefers-color-scheme: dark)\" srcset=\"${ASSETS}/font-preview-dark.png\">"
              echo "  <img alt=\"Preview of the fonts added in this release\" width=\"${PREVIEW_WIDTH}\" src=\"${ASSETS}/font-preview-light.png\">"
              echo "</picture>"
            fi
          } > build/ReleaseNotes.md

          echo "Release notes:"
          cat build/ReleaseNotes.md

      - name: Create new release
        if: steps.should_release.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: ${{ steps.create_tag.outputs.tag }}
          body_path: build/ReleaseNotes.md
          files: |
            build/FontList.luau
            build/FontList.json
            build/font-preview-light.png
            build/font-preview-dark.png
            build/font-preview-light.svg
            build/font-preview-dark.svg

      - name: Publish to Wally
        if: steps.should_release.outputs.release == 'true'
        shell: bash
        run: |
          # Create a new wally.toml from the template
          cp .generated.wally.toml wally.toml

          # Extract version number from the tag
          VERSION="${{ steps.create_tag.outputs.tag }}"

          # Remove the leading "v"
          VERSION="${VERSION#v}"

          # Remove leading zeros from the version number
          VERSION=$(echo $VERSION | sed -E 's/\.0+/\./g')

          # Replace the version placeholder in wally.toml
          sed -i "s/{{version}}/${VERSION}/g" wally.toml

          # Publish to Wally
          mkdir -p ~/.wally
          printf "[tokens]\n\"https://api.wally.run/\" = \"%s\"" "${{ secrets.WALLY_TOKEN }}" >> ~/.wally/auth.toml
          wally publish
